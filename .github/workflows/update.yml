name: update
on:
  schedule:
    # every 5 min, Sun 21:00 UTC to Fri 07:59 UTC (covers the ASX day in Perth with margin)
    - cron: "*/5 21-23,0-7 * * 0-5"
  workflow_dispatch:
  push:
    paths: ["oi.json"]
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - name: Publish
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          msg="data $(date -u +%FT%TZ)"
          if git log -1 --pretty=%s | grep -q '^data '; then
            git commit --amend -m "$msg"; git push --force-with-lease
          else
            git commit -m "$msg"; git push
          fi
