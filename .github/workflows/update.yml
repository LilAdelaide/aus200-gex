name: update
on:
  schedule:
    # GitHub's timer is slow and uneven, so each run keeps going for ~55 minutes and refreshes every minute
    - cron: "*/20 21-23,0-7 * * 0-5"
  workflow_dispatch:
  push:
    paths: ["oi.json"]
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh every minute
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update.py --loop 3300 --every 60
